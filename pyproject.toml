[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relationship-agent"
version = "0.3.0"
description = "Persona AI: person-aware relationship memory with a checkpointed agent harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi==0.142.2", "sqlalchemy==2.0.54", "psycopg[binary]==3.3.6", "uvicorn==0.53.0", "python-dotenv==1.2.3", "cryptography==50.0.1"]

[project.optional-dependencies]
dev = ["ruff==0.17.4"]
mcp = ["mcp>=1.20,<2"]
# Kept as an installation alias for existing deployment commands.
beta = []
test = ["httpx==0.28.1", "playwright==1.63.0"]

[project.scripts]
relationship-agent = "relationship_agent.beta.app:main"
relationship-agent-web = "relationship_agent.beta.app:main"
relationship-agent-mcp = "relationship_agent.beta.mcp_server:main"
persona-ai = "relationship_agent.beta.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relationship_agent = ["persona_web/*.html", "persona_web/*.js", "persona_web/*.css"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Syntax/undefined names plus docstrings on public Python interfaces.
select = ["F", "E9", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
# Descriptive test names are the assertions' documentation; modules still need a summary.
"tests/**" = ["D101", "D102", "D103"]
